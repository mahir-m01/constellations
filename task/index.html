<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7D6D0">
<title>Constellations: a memory experiment</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Fraunces-Bold-Soft.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InstrumentSans-Var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fonts: Fraunces (headings) and Instrument Sans (text), both SIL OFL 1.1, self-hosted in fonts/ (see OFL-*.txt).
     Palette: Color Hunt https://colorhunt.co/palette/fff5f5f7d6d0e2b4bd4a4a4a
     (#FFF5F5 paper, #F7D6D0 blush, #E2B4BD rose, #4A4A4A ink). Light theme only on purpose:
     every participant must see an identical display, so there is no prefers-color-scheme block. */
  @font-face { font-family: "Fraunces"; src: url("fonts/Fraunces-Bold-Soft.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Instrument Sans"; src: url("fonts/InstrumentSans-Var.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap; }

  :root {
    color-scheme: light;
    --bg: #F7D6D0;      /* page: blush */
    --panel: #FFF5F5;   /* cards, buttons, unlit stars: paper */
    --ink: #4A4A4A;     /* text, borders, shadows, lit stars */
    --muted: #665053;   /* secondary text, 5.5:1 on blush, 6.9:1 on paper */
    --line: #4A4A4A;    /* crisp borders (same as ink) */
    --soft: #E2B4BD;    /* rose: soft rules */
    --accent: #E2B4BD;  /* rose: primary button fill */
    --good: #34704F;    /* meter ok, 5.5:1 on paper */
    --bad: #A63049;     /* meter and warnings, 6.2:1 on paper */
    --star: #FFF5F5;    /* unlit star fill (light) */
    --lit: #4A4A4A;     /* flashing star fill (dark): lightness contrast, not hue */
    --stroke: 2px;
    --radius: 6px;
    --sticker: 4px 4px 0 var(--ink);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); background: var(--bg);
    font: 17px/1.5 var(--sans); }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  ::selection { background: var(--accent); color: var(--ink); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #bar { height: 8px; background: var(--panel); border-bottom: var(--stroke) solid var(--line); }
  #bar > div { height: 100%; width: 0; background: var(--ink); }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { max-width: 660px; width: 100%; background: var(--panel); border: var(--stroke) solid var(--line);
    border-radius: var(--radius); box-shadow: 6px 6px 0 var(--ink); padding: 24px; }
  .card h1, .card h2 { font-family: var(--serif); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .card h1 { font-size: 2rem; margin: 0 0 .6rem; }
  .card h2 { font-size: 1.4rem; margin: 0 0 .5rem; }
  .muted { color: var(--muted); }
  .tag { font-family: var(--sans); font-size: .8rem; font-weight: 700; vertical-align: middle; letter-spacing: .02em;
    border: var(--stroke) solid var(--line); border-radius: 999px; padding: .1rem .6rem; background: var(--accent); }
  .note { background: var(--bg); border: var(--stroke) dashed var(--line); border-radius: var(--radius); padding: .6rem .8rem; }
  a { color: var(--ink); text-underline-offset: .15em; }
  label { display: block; margin: .7rem 0 .25rem; font-weight: 600; }
  input, select { width: 100%; padding: .55rem .7rem; border-radius: 4px; border: var(--stroke) solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit; }
  input[type=checkbox], input[type=radio] { appearance: none; -webkit-appearance: none; width: 1.2rem; height: 1.2rem;
    margin: 0 .5rem 0 0; padding: 0; vertical-align: -.25rem; border-radius: 4px; background: var(--panel); }
  input[type=radio] { border-radius: 50%; }
  input[type=checkbox]:checked, input[type=radio]:checked { background: var(--ink); box-shadow: inset 0 0 0 3px var(--panel); }
  button { font: inherit; font-weight: 600; padding: .65rem 1.2rem; border-radius: var(--radius); border: var(--stroke) solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer; touch-action: manipulation; box-shadow: var(--sticker); }
  button:hover { background: var(--bg); }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button.primary { background: var(--accent); }
  button.primary:hover { background: var(--bg); }
  button.chosen, button.chosen:hover { background: var(--ink); color: var(--panel); box-shadow: 4px 4px 0 var(--accent); }
  button:disabled, button:disabled:hover, button:disabled:active { opacity: .45; cursor: default; background: var(--panel);
    transform: none; box-shadow: var(--sticker); }
  .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  kbd { font: inherit; font-size: .8em; font-weight: 600; background: var(--panel); border: 1.5px solid var(--line);
    border-bottom-width: 3px; border-radius: 4px; padding: 0 .4rem; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  td, th { border-bottom: 1.5px solid var(--soft); padding: .35rem .5rem; text-align: left; }
  th { border-bottom: var(--stroke) solid var(--line); }
  .likert { display: grid; grid-template-columns: 1fr repeat(5, 2.2rem); gap: .45rem .2rem; align-items: center; font-size: .92rem; }
  .likert .h { font-size: .75rem; font-weight: 600; color: var(--muted); text-align: center; }
  .likert input { margin: 0 auto; display: block; }

  /* sky: layout is fixed within a trial so stars never move on screen.
     Stars differ by lightness (paper fill vs ink fill), never by hue alone, and never animate. */
  .sky { display: flex; flex-direction: column; align-items: center; user-select: none; touch-action: none; }
  .sky svg { width: min(88vw, 62vh, 520px); height: min(88vw, 62vh, 520px); display: block; }
  .star { fill: var(--star); stroke: var(--ink); stroke-width: 1; transition: none; }
  .star.lit { fill: var(--lit); }
  .hit { fill: transparent; }   /* invisible tap area around each star, about 70 px wide on a phone; the star itself is unchanged */
  .sky.pick .star, .sky.pick .hit { cursor: pointer; }
  .fix { fill: var(--ink); font-family: var(--sans); font-size: 22px; font-weight: 600; text-anchor: middle;
    dominant-baseline: central; pointer-events: none; }
  .num { fill: var(--ink); font-family: var(--sans); font-size: 9px; font-weight: 700; text-anchor: middle;
    dominant-baseline: central; pointer-events: none; }
  .msg { min-height: 3.2rem; text-align: center; }
  .meter { width: min(320px, 80vw); height: 14px; border-radius: 7px; background: var(--panel); border: var(--stroke) solid var(--line);
    overflow: hidden; visibility: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--bad); }
  .meter.ok > div { background: var(--good); }
  .meter.calib > div { background: var(--ink); }   /* sound check: just a level, no right or wrong yet */
  .pad { width: min(320px, 80vw); height: 64px; margin-top: 8px; border-radius: var(--radius); border: var(--stroke) dashed var(--line);
    background: var(--panel); display: none; align-items: center; justify-content: center; color: var(--muted); }

  @media (max-width: 480px) {
    #stage { padding: 12px; }
    .card { padding: 18px 16px; box-shadow: 4px 4px 0 var(--ink); }
    .card h1 { font-size: 1.7rem; }
    .likert { grid-template-columns: 1fr repeat(5, 1.9rem); gap: .4rem .1rem; font-size: .88rem; }
  }
</style>
</head>
<body>
<div id="bar"><div></div></div>
<main id="stage"><p class="muted">Loading…</p></main>
<script src="task.js"></script>
</body>
</html>
